name: Windows build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: msys2 {0}
        run: cmake --build build-ci
      - name: Test
        shell: msys2 {0}
        run: ctest --test-dir build-ci --output-on-failure
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ClickFlow-windows-x64
          path: |
            build-ci/clickflow.exe
            build-ci/clickflow_click_counter.exe
            README.md
            README.en.md
            LICENSE
            LICENSES.md
            third_party/cjson/LICENSE
            third_party/nuklear/LICENSE.md
